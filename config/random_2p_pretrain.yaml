# Phase 1 of two-phase training: fast 2-player pretraining (self-play).
#   Slot 0: PPO learner
#   Slot 1: Frozen PPO copy (promoted when learner beats it >55%)
# 2 players → games actually RESOLVE (one side eliminated), so the sparse
# win/loss reward fires and the value head gets real targets. The 6-player
# variant rarely terminates (army accumulation > attrition) → near-zero
# returns, dead value loss, diverging KL. obs_dim is fixed (137) regardless
# of player count, so this checkpoint transfers cleanly into the 6-player
# Phase 2 (config/llm_6p.yaml). No LLM calls → episodes take ~seconds.

total_timesteps: 100000
n_envs: 1
save_freq: 500
eval_freq: 500
seed: 42
device: auto
# Cap on PLAYER-TURNS (not env steps; one turn spans trade/reinforce/attack/
# fortify phase-actions). Weak early policies rarely eliminate the opponent on
# 42 territories, so most games hit the cap as a draw — but the trainer now
# marks the final transition done and hands it a territory-margin terminal
# reward (RewardConfig.terminal_margin_weight), so the value head still gets a
# graded win/loss target instead of a dead 0. 300 turns keeps episodes bounded.
max_turns: 300

ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  n_steps: 2048
  n_epochs: 10
  batch_size: 64

network:
  hidden_sizes: [256, 256]
  activation: tanh

self_play:
  opponent_update_freq: 50
  best_metric: win_rate
  promote_threshold: 0.55
  eval_games: 10
  n_players: 2
  # llm_profiles_path intentionally omitted → self-play promotion active

reward:
  sparse_win: 1.0
  sparse_loss: -1.0
  dense_territory_delta: 0.01
  dense_continent_bonus_delta: 0.05
  dense_army_ratio: 0.005
  dense_elimination_bonus: 0.1
  invalid_action_penalty: -0.01
