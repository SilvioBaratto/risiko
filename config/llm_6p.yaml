# 6-player training: RL agent (slot 0) vs 5 LLM opponents (slots 1-5)
# Each LLM opponent has a distinct strategy_hint and temperature.
# Expect ~1-2 min per episode (5 LLM turns per player turn, ~200 turns/game).

total_timesteps: 1000000
n_envs: 1
# Slow LLM games: checkpoint after every completed game so a crash loses at
# most one in-progress game (was 50 — weeks of unsaved play at hours/game).
save_freq: 1
eval_freq: 50
seed: 42
device: auto
# Memory cap per episode (LLM games are slow but typically end faster than
# random games due to varied policies). 2000 turns covers most LLM games.
max_turns: 2000

ppo:
  # lr lowered 3e-4 -> 1e-4 and n_epochs 10 -> 4: the first updates start from a
  # sharp BC-warm-started policy over one game's small correlated rollout, which
  # diverged (approx_kl ~3.2) at the old settings. target_kl bails the epoch loop
  # the moment the policy drifts too far.
  lr: 0.0001
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  n_steps: 2048
  n_epochs: 4
  target_kl: 0.02   # k3-estimator KL; epoch loop bails at 1.5x (=0.03)
  batch_size: 64

network:
  hidden_sizes: [256, 256]
  activation: tanh

self_play:
  opponent_update_freq: 50
  best_metric: win_rate
  promote_threshold: 0.55
  eval_games: 10
  n_players: 6
  llm_profiles_path: config/default_6p.yaml

reward:
  sparse_win: 1.0
  sparse_loss: -1.0
  dense_territory_delta: 0.01
  dense_continent_bonus_delta: 0.05
  dense_army_ratio: 0.005
  dense_elimination_bonus: 0.1
  invalid_action_penalty: -0.01

# Early stopping on win-rate vs a fixed RandomAgent baseline (not the gemma
# opponents — that signal is circular and ~0 for a long time in 6p). Eval games
# use random seats only, so a check costs no LLM calls. Smoothed over a window;
# stop after `patience` checks with no `> min_delta` gain; keep the best.pt.
early_stop:
  enabled: true
  eval_every: 20      # episodes between baseline evals (~hours apart, glm-bound)
  eval_games: 20      # random-vs-learner games per eval (cheap, no LLM)
  window: 5           # moving-average window (smooths noisy win-rate)
  patience: 10        # evals with no improvement before stopping
  min_delta: 0.01     # smallest smoothed win-rate gain that counts
  restore_best: true  # reload best.pt when stopping

# Diplomacy layer — eval-only. Disabled here; set enabled: true only in the
# social-eval harness. Training reads diplomacy: but the enabled=false default
# guarantees zero negotiation calls on all training paths.
diplomacy:
  enabled: false
  n_rounds: 1
  max_message_tokens: 128
