# 6-player training: RL agent (slot 0) vs 5 LLM opponents (slots 1-5)
# Each LLM opponent has a distinct strategy_hint and temperature.
# Expect ~1-2 min per episode (5 LLM turns per player turn, ~200 turns/game).

total_timesteps: 1000000
n_envs: 1
# Slow LLM games: checkpoint after every completed game so a crash loses at
# most one in-progress game (was 50 — weeks of unsaved play at hours/game).
save_freq: 1
eval_freq: 50
seed: 42
device: auto
# Memory cap per episode (LLM games are slow but typically end faster than
# random games due to varied policies). 2000 turns covers most LLM games.
max_turns: 2000

ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  n_steps: 2048
  n_epochs: 10
  batch_size: 64

network:
  hidden_sizes: [256, 256]
  activation: tanh

self_play:
  opponent_update_freq: 50
  best_metric: win_rate
  promote_threshold: 0.55
  eval_games: 10
  n_players: 6
  llm_profiles_path: config/default_6p.yaml

reward:
  sparse_win: 1.0
  sparse_loss: -1.0
  dense_territory_delta: 0.01
  dense_continent_bonus_delta: 0.05
  dense_army_ratio: 0.005
  dense_elimination_bonus: 0.1
  invalid_action_penalty: -0.01
