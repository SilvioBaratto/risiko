# Tournament configuration for the LLM-only strategy-discovery mode.
#
# This file is validated by tests/test_tournament_config.py via yaml.safe_load.
# It must NOT be loaded through src.config.load_config (no TrainingConfig).
#
# Strategies are referenced by name slug — the authoritative definitions live
# in src/agents/strategies.py::STRATEGY_CATALOG (DRY: no redefinition here).

# ── Identity & reproducibility ──────────────────────────────────────────────
name: llm_strategy_tournament
seed: 42

# ── Scale & concurrency ──────────────────────────────────────────────────────
# Start with a 30-game pilot to validate the pipeline; scale to 1000+ games
# for statistically significant strategy win-rates (Wilson CI).
n_games: 30
max_concurrency: 6   # one concurrent game per model seat (I/O-bound LLM calls)

# ── Diplomacy ────────────────────────────────────────────────────────────────
n_rounds: 1            # negotiation rounds per cycle (was 2 — halved for throughput)
negotiation_cadence: 4 # negotiate every 4th player-turn (was every turn) — diplomacy
                       # is the dominant per-turn cost (~12 calls/turn at 6p × 2 rounds);
                       # alliances persist between negotiations, so board play is unaffected.

# ── Per-game turn cap (draw backstop + cost bound) ───────────────────────────
# 6-player games need ~150-200 player-turns to reach a winner; lower values
# trade resolution for speed (more draws). Each turn drives many slow LLM calls,
# so this also bounds per-game wall-clock/cost.
max_turns: 200

# ── Per-action LLM timeout (s) ───────────────────────────────────────────────
# Fast models answer in <5s; a model exceeding this falls back to a random legal
# move so it cannot stall a game. (minimax-m3 was dropped for taking ~74s/action.)
action_timeout: 45

# ── Draw resolution ──────────────────────────────────────────────────────────
# 6-player games rarely eliminate down to one survivor within max_turns, so
# "territory" scores the board leader (most territories, tie-break armies) as the
# winner at the cap — giving the leaderboard signal. True elimination wins are
# always recorded as such; the ledger's `resolution` field distinguishes them.
# Set "none" to record uncapped draws as winner=None instead.
draw_resolution: territory

# ── Strategy catalog reference (by module path, not by value) ────────────────
strategy_catalog: src.agents.strategies

# ── Strategy slugs (must match STRATEGY_CATALOG names exactly) ───────────────
strategies:
  - australia_lock
  - south_america_lock
  - aggressive_blitz
  - turtle_defensive
  - card_cycle_hunter
  - diplomat_coalition

# ── 6-model roster (Ollama cloud, :cloud suffix convention) ─────────────────
models:
  - glm-5.2:cloud
  - gemma4:31b-cloud      # replaced minimax-m3 (ignored think=False on cloud:
                          # ~5389 tok / ~74s per action → timed out to random)
  - glm-5.1:cloud
  - kimi-k2.6:cloud
  - deepseek-v4-flash:cloud
  - qwen3.5:cloud

# ── Sampling parameters (applied uniformly; per-player overrides in Cycle 8) ─
temperature: 0.7
top_p: 0.9
