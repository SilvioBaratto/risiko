# Default hyperparameters for Risiko RL PPO training

# Training loop
total_timesteps: 1000000
n_envs: 1
save_freq: 100
eval_freq: 50
seed: 42
device: auto

# PPO hyperparameters
ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  n_steps: 2048
  n_epochs: 10
  batch_size: 64

# Network architecture
network:
  hidden_sizes: [256, 256]
  activation: tanh
